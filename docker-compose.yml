services:
  cloudops-sentinel:
    build:
      context: .
    container_name: cloudops-sentinel
    ports:
      - "5000:5000"
    environment:
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - "${USERPROFILE}/.aws:/home/appuser/.aws:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
